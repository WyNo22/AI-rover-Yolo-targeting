<circle cx="900" cy="367" r="34" fill="#222"/><circle cx="900" cy="367" r="22" fill="#555"/>
<path d="M934 367 H1050" stroke="#2e7d32" stroke-width="4"/><circle cx="1050" cy="367" r="6" fill="#d32f2f"/>
<text x="900" y="423" font-size="15" font-weight="700" text-anchor="middle">FSR pointe int.</text>
<text x="800" y="357" font-size="13" fill="#2e7d32" text-anchor="middle">patte 2</text><text x="990" y="357" font-size="13" fill="#2e7d32" text-anchor="middle">patte 1 → 3V3</text>
<text x="660" y="513" font-size="17" font-weight="600" text-anchor="end">A2</text><circle cx="680" cy="507" r="6"/>
<path d="M680 507 H860" stroke="#2e7d32" stroke-width="4"/>
<circle cx="740" cy="507" r="6" fill="#2e7d32"/><path d="M740 507 V525" stroke="#7a5a12" stroke-width="3"/>
<rect x="728" y="525" width="24" height="50" rx="4" fill="#f3d9a4" stroke="#7a5a12" stroke-width="2"/>
