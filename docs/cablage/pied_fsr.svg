<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Helvetica, Arial, sans-serif"><rect width="1100" height="700" fill="#fff"/>
<text x="30" y="42" font-size="28" font-weight="700" fill="#111">Câblage du pied GAUCHE : 3 FSR402B + ADS1015 → Pico 2</text>
<text x="30" y="70" font-size="16" fill="#555">Le symbole ⏚ = relié à la masse (GND). Résistances soudées sur la carte ADS, entre A0/A1/A2 et GND.</text>
