<text x="150" y="560" font-size="14">ADDR → GND (les 2 pieds)</text><text x="150" y="580" font-size="14">adresse 0x48</text>
<text x="575" y="560" font-size="13" fill="#555" text-anchor="middle">A3, ALERT : rien</text>
