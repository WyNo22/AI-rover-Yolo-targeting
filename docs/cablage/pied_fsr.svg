<text x="762" y="557" font-size="14" fill="#7a5a12">1 kΩ</text>
<circle cx="900" cy="507" r="34" fill="#222"/><circle cx="900" cy="507" r="22" fill="#555"/>
<path d="M934 507 H1050" stroke="#2e7d32" stroke-width="4"/><circle cx="1050" cy="507" r="6" fill="#d32f2f"/>
<text x="900" y="563" font-size="15" font-weight="700" text-anchor="middle">FSR pointe ext.</text>
<text x="800" y="497" font-size="13" fill="#2e7d32" text-anchor="middle">patte 2</text><text x="990" y="497" font-size="13" fill="#2e7d32" text-anchor="middle">patte 1 → 3V3</text>
<text x="30" y="650" font-size="15" fill="#333">FSR et résistances : pas de sens. Sur chaque A : patte 2 du FSR + une patte de la résistance (l'autre patte → GND).</text>
<text x="30" y="675" font-size="15" fill="#333">Pied DROIT : même câblage, mais SDA → GP16 (broche 21) et SCL → GP17 (broche 22). Chaque pied a ses broches.</text>
</svg>